version: "3.9"

services:

  # ─────────────────────────────────────────
  # PostgreSQL — Création automatique de la DB
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: boost_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: link
      POSTGRES_USER: lelouch
      POSTGRES_PASSWORD: Yowyob2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lelouch -d link"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ─────────────────────────────────────────
  # Application Django
  # ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boost_web
    restart: unless-stopped
    env_file:
      - .env.example                 # Contient SECRET_KEY, CLOUDINARY_*, etc.
    environment:
      # Pointe vers le conteneur "postgres" — surcharge DATABASE_URL du .env si présent
      DATABASE_URL: postgres://lelouch:Yowyob2026@postgres:5432/link
      DEBUG: ${DEBUG:-True}
      PORT: ${PORT:-8000}
      # Cloudinary — passé depuis .env automatiquement via env_file
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - .:/app               # Hot-reload en développement
      - staticfiles_vol:/app/staticfiles
      - media_vol:/app/media # Stockage local media (fallback si Cloudinary non configuré)
    depends_on:
      postgres:
        condition: service_healthy  # Attend que PostgreSQL soit vraiment prêt

volumes:
  postgres_data:             # Données PostgreSQL persistantes
  staticfiles_vol:
  media_vol: