version: "3.9"

services:

  # ─────────────────────────────────────────
  # PostgreSQL — Création automatique de la DB
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: boost_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: link
      POSTGRES_USER: lelouch
      POSTGRES_PASSWORD: Yowyob2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lelouch -d link"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ─────────────────────────────────────────
  # Application Django
  # ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-boost
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      # Paramètres séparés — pas d'URL avec caractères spéciaux
      POSTGRES_DB: link
      POSTGRES_USER: lelouch
      POSTGRES_PASSWORD: Yowyob2026
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DEBUG: "False"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles_vol:/app/staticfiles
      - media_vol:/app/media
    depends_on:
      postgres:
        condition: service_healthy

        
volumes:
  postgres_data:             # Données PostgreSQL persistantes
  staticfiles_vol:
  media_vol: